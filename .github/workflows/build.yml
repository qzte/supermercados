name: Build

# Compila o JSX de src/index.src.html e faz commit do index.html gerado (e da
# cópia versionada). O GitHub Pages continua a servir a partir do branch — não é
# preciso mexer nas definições de Pages.
#
# O gatilho ignora de propósito os ficheiros gerados: o commit que este workflow
# faz toca apenas em index.html e ulsm_supermercados_*.html, portanto não se
# volta a accionar a si próprio.

# Só `push`, de propósito. O push cobre todos os branches deste repositório,
# incluindo os de pull requests — acrescentar o gatilho `pull_request` criava
# duas execuções em grupos de concorrência diferentes que podiam tentar fazer
# commit e push em simultâneo sobre os mesmos ficheiros.
# Para contribuições vindas de forks, o build corre-se localmente com
# `npm run build` (ou verifica-se com `npm run check`).
on:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Uma execução de cada vez por branch, para dois pushes seguidos não gerarem
# commits concorrentes sobre os mesmos ficheiros.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions fixadas por SHA e não por tag: uma tag pode ser reapontada para
      # outro commit, e o CI passava a executar código diferente sem que nada
      # mudasse aqui. Ao actualizar, mudar o SHA **e** o comentário ao lado.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}
          # Sem isto, o token de escrita fica gravado em .git/config durante todo
          # o job — incluindo enquanto corre o `npm ci` e o `tools/build.mjs`,
          # que executam código do repositório e das suas dependências. Uma
          # dependência comprometida bastava para o ler. O push abaixo passa a
          # autenticar-se explicitamente, no único passo que precisa.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm

      # `--ignore-scripts`: o build só precisa do Babel como biblioteca; nenhuma
      # dependência tem scripts de instalação legítimos a correr aqui.
      - run: npm ci --ignore-scripts

      - name: Compilar
        run: npm run build

      - name: Validar o resultado
        run: |
          # Se o Babel tivesse ficado no ficheiro servido, o build não teria
          # cumprido o seu propósito.
          if grep -q 'babel-standalone' index.html; then
            echo "::error::index.html ainda carrega o Babel — o build não removeu a dependência."
            exit 1
          fi
          if grep -q 'type="text/babel"' index.html; then
            echo "::error::index.html ainda contém JSX por compilar."
            exit 1
          fi
          # A cópia arquivada tem de ser byte a byte igual ao ficheiro servido —
          # é essa a convenção do repositório.
          archive=$(ls ulsm_supermercados_*_*_*.html)
          if ! cmp -s index.html "$archive"; then
            echo "::error::index.html e $archive divergem."
            exit 1
          fi
          echo "index.html e $archive gerados e coerentes ($(wc -c < index.html) bytes)."

      - name: Fazer commit dos ficheiros gerados
        env:
          # Único passo com acesso ao token. Passá-lo pelo ambiente, e não pelo
          # .git/config, mantém-no fora do alcance dos passos que executam código.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- index.html 'ulsm_supermercados_*.html'; then
            echo "Nada a fazer — os ficheiros gerados já estão actualizados."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 'ulsm_supermercados_*.html'
          git commit -m "build: regenerar index.html a partir de src/index.src.html [skip ci]"

          # O URL com o token vai como argumento e não fica gravado em lado
          # nenhum — `git push <url>` não escreve no .git/config. O Actions
          # mascara o GITHUB_TOKEN nos logs.
          # O refspec é explícito porque o checkout foi feito por `ref`, e sem
          # credenciais persistidas não há upstream configurado.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
